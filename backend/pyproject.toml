[project]
name = "abstract-essence-api"
version = "0.1.0"
description = "Source-grounded research learning workspace"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]",
    "sqlmodel",
    "psycopg[binary]",
    "redis",
    "pydantic-settings",
    "pydantic-ai-slim[openai,google,anthropic]",
    "alembic",
    "httpx2>=2.13.1",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "ty"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/essence"]

[tool.fastapi]
entrypoint = "essence.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
