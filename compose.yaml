name: abstract-essence
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: essence
      POSTGRES_USER: essence
      POSTGRES_PASSWORD: local-essence-only
    ports: ["127.0.0.1:5547:5432"]
    volumes: ["essence-postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U essence -d essence"]
      interval: 3s
      timeout: 3s
      retries: 15
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports: ["127.0.0.1:6381:6379"]
    volumes: ["essence-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  essence-postgres:
  essence-redis:
