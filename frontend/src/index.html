<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Abstract Essence — Reading studio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1a1a1a" />
    <style>
      html {
        color-scheme: dark;
        background: #1a1a1a;
      }
      html[data-theme='light'] {
        color-scheme: light;
        background: #f2f5fa;
      }
    </style>
    <script>
      // Apply the explicit preference before styles and Angular load. Dark is the default.
      try {
        if (localStorage.getItem('abstract-essence:reading-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').content = '#f2f5fa';
        }
      } catch {
        // Storage access is optional; the default theme remains usable.
      }
    </script>
    <link rel="preload" href="fonts/source-sans-3.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
